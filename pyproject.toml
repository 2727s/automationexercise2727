[project]
name = "automationexercise"
version = "0.1.0"
description = "Playwright + pytest framework for automationexercise.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13",
    "playwright>=1.49",
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "faker>=30.0",
    "python-dotenv>=1.0",
]

# Test project: install dependencies only, do not build a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# Chromium is the only browser this suite launches.
# The inventory path is one argument, so the space in the folder name stays intact.
addopts = [
    "-v",
    "--browser",
    "chromium",
    "--screenshot",
    "only-on-failure",
    "--alluredir=artifacts/test inventory/allure-results",
]
base_url = "https://www.automationexercise.com"
log_file = "logs/test_run.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)s %(test_name)s %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
